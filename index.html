<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>과학 용어 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one screen, a friendly title and two big game cards side by side (stacked on narrow portrait). */
:root {
  --bg: #eef3fb;
  --surface: #ffffff;
  --ink: #1d2546;
  --muted: #5f6889;
  --line: #d6ddec;
  --bingo: #2f55d4;
  --bingo-soft: #e3e9fb;
  --word: #ff7a59;
  --word-soft: #ffe8e1;
  --danger: #d93a5b;
  --ok: #138a5e;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121624; --surface: #1c2236; --ink: #e9ecf6; --muted: #9ea7c4; --line: #2f3753;
    --bingo: #8ea6ff; --bingo-soft: #252f52; --word: #ff9a7f; --word-soft: #3b2a2b;
    --danger: #ff6f8c; --ok: #45d39e; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.wrap { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: clamp(16px, 3vh, 32px); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 6vw, 56px); line-height: 1.1; margin: 0; text-align: center; text-wrap: balance; }
.lead { margin: 6px 0 0; text-align: center; color: var(--muted); font-size: clamp(14px, 2vw, 17px); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 2.5vw, 28px); }
@media (max-width: 560px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.game {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: clamp(18px, 3vw, 32px);
  color: inherit; text-decoration: none; font: inherit; cursor: pointer; width: 100%;
  transition: transform .15s, border-color .15s;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.game:hover { transform: translateY(-3px); }
.game:focus-visible { outline: 3px solid var(--bingo); outline-offset: 3px; }
.game.bingo:hover { border-color: var(--bingo); }
.game.word:hover { border-color: var(--word); }
.game h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 38px); margin: 0; line-height: 1.1; }
.game p { margin: 0; color: var(--muted); font-size: clamp(13px, 1.8vw, 15px); }
.art { width: min(100%, 220px); aspect-ratio: 1.4; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
.bingo .art { background: var(--bingo-soft); }
.word .art { background: var(--word-soft); position: relative; overflow: hidden; }
.mini-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 62%; }
.mini-board i { aspect-ratio: 1; border-radius: 4px; background: var(--surface); border: 1.5px solid var(--line); position: relative; }
.mini-board i.on::after { content: ""; position: absolute; inset: 18%; border-radius: 50%; border: 2px solid var(--bingo); background: color-mix(in srgb, var(--bingo) 20%, transparent); }
.bub { position: absolute; font-family: var(--font-display); font-size: clamp(12px, 1.6vw, 15px); padding: 4px 12px; border-radius: 999px; color: #5a3a1c; box-shadow: 0 3px 0 rgba(0,0,0,.08); white-space: nowrap; animation: float 3.2s ease-in-out infinite; }
.bub:nth-child(1) { background: #ffd6a5; left: 8%; top: 14%; }
.bub:nth-child(2) { background: #caffbf; right: 10%; top: 30%; animation-delay: -1s; }
.bub:nth-child(3) { background: #bde0fe; left: 18%; bottom: 14%; animation-delay: -2s; }
.bub:nth-child(4) { background: #ffc6ff; right: 16%; bottom: 22%; animation-delay: -1.6s; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
@media (prefers-reduced-motion: reduce) { .bub { animation: none; } }
.go { font-family: var(--font-display); font-size: clamp(17px, 2.4vw, 21px); padding: 10px 26px; border-radius: 999px; color: #fff; }
.bingo .go { background: var(--bingo); }
.word .go { background: var(--word); }
.lock-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--word); }
.lock-badge svg { width: 14px; height: 14px; }
.word.locked .art { filter: grayscale(.6); opacity: .7; }

/* password box */
.lockbox { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
.lockbox form { display: flex; gap: 8px; width: 100%; max-width: 280px; }
.lockbox input {
  flex: 1; min-width: 0; font: inherit; font-size: 20px; letter-spacing: .3em; text-align: center; padding: 8px 10px;
  border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
}
.lockbox input:focus-visible { outline: none; border-color: var(--word); }
.lockbox button { font-family: var(--font-display); font-size: 18px; border: 0; border-radius: 12px; padding: 0 16px; background: var(--word); color: #fff; cursor: pointer; }
.lockbox button:focus-visible { outline: 3px solid var(--word); outline-offset: 2px; }
.lockmsg { min-height: 1.3em; margin: 0; font-size: 13px; font-weight: 700; color: var(--danger); }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
</style>
</head>
<body>
<main class="wrap">
  <div>
    <h1>어떤 게임을 할까요?</h1>
    <p class="lead">전기와 자기 단원 용어로 즐기는 게임이에요.</p>
  </div>
  <div class="cards">
    <a class="game bingo" href="bingo.html">
      <div class="art" aria-hidden="true">
        <div class="mini-board">
          <i class="on"></i><i></i><i></i><i class="on"></i><i></i>
          <i></i><i class="on"></i><i></i><i></i><i></i>
          <i></i><i></i><i class="on"></i><i></i><i class="on"></i>
          <i class="on"></i><i></i><i></i><i class="on"></i><i></i>
          <i></i><i></i><i class="on"></i><i></i><i class="on"></i>
        </div>
      </div>
      <h2>빙고</h2>
      <p>나만의 5×5 판에서 진행자가 부르는 용어를 표시해요.</p>
      <span class="go">시작하기</span>
    </a>

    <div class="game word locked" id="wordCard" role="group" aria-label="단어 맞추기">
      <div class="art" aria-hidden="true">
        <span class="bub">전압</span><span class="bub">자기장</span><span class="bub">코일</span><span class="bub">V=IR</span>
      </div>
      <h2>단어 맞추기</h2>
      <p>떠다니는 용어 중 정답만 골라 터치하고 랭킹에 도전해요.</p>
      <div class="lockbox" id="lockbox">
        <span class="lock-badge">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>
          잠겨 있어요. 비밀번호를 입력하세요.
        </span>
        <form id="unlockForm" autocomplete="off">
          <input id="pw" type="password" inputmode="numeric" maxlength="8" aria-label="비밀번호" placeholder="••••">
          <button type="submit">열기</button>
        </form>
        <p class="lockmsg" id="lockMsg" role="alert"></p>
      </div>
      <a class="go" id="wordGo" href="word.html" hidden>시작하기</a>
    </div>
  </div>
</main>
<script>
(() => {
  // Classroom gate only: the password lives in this page, so it keeps games closed until the teacher shares it.
  const PASSWORD = "2026";
  const KEY = "word.unlocked";
  const card = document.getElementById("wordCard");
  const unlocked = () => { try { return sessionStorage.getItem(KEY) === "1"; } catch { return false; } };
  function show() {
    const on = unlocked();
    card.classList.toggle("locked", !on);
    document.getElementById("lockbox").hidden = on;
    document.getElementById("wordGo").hidden = !on;
  }
  document.getElementById("unlockForm").addEventListener("submit", e => {
    e.preventDefault();
    const pw = document.getElementById("pw");
    if (pw.value.trim() === PASSWORD) {
      try { sessionStorage.setItem(KEY, "1"); } catch {}
      location.href = "word.html";
    } else {
      document.getElementById("lockMsg").textContent = "비밀번호가 맞지 않아요.";
      pw.value = "";
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    }
  });
  show();
})();
</script>
</body>
</html>
